<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charaktereigenschaften: Vermutungen</title>
    <style>
        :root {
            --bg-color: #dcc8a8;
            --primary-color: #e6a54c;
            --text-color: #333;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 60%),
                url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 10 L 90 90 M 90 10 L 10 90" stroke="%23a68a64" stroke-width="0.5" opacity="0.3"/></svg>');
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px 0;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid var(--primary-color);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: #2c3e50;
        }

        p.subtitle {
            margin: 5px 0 0;
            font-size: 1rem;
            color: #555;
        }

        .game-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            flex-wrap: wrap;
        }

        /* Боковые панели со словами */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            min-width: 150px;
            padding-top: 60px;
        }

        /* Центральные колонки */
        .drop-zone-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            max-width: 300px;
            min-width: 250px;
        }

        .drop-zone-title {
            background: white;
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .drop-zone {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed #888;
            border-radius: 10px;
            width: 100%;
            height: 500px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            transition: background 0.3s;
            box-sizing: border-box;
        }

        .drop-zone.drag-over {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--primary-color);
        }

        /* Карточки слов */
        .word-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            cursor: grab;
            text-align: center;
            font-size: 0.95rem;
            user-select: none;
            transition: transform 0.2s, background-color 0.3s;
            position: relative;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid transparent;
        }

        .word-card:active {
            cursor: grabbing;
        }

        .word-card:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        /* Валидация */
        .word-card.correct {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .word-card.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Футер с кнопками */
        .controls {
            margin-top: 30px;
            margin-bottom: 50px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-check {
            background-color: #2c3e50;
            color: white;
        }
        .btn-check:hover { background-color: #34495e; }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }
        .btn-reset:hover { background-color: #c0392b; }

        #message {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
            width: 100%;
        }
        
        .message-success { background: #d4edda; color: #155724; }
        .message-error { background: #f8d7da; color: #721c24; }

        /* Адаптивность */
        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .side-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                padding-top: 0;
            }
            .side-panel .word-card {
                width: auto;
                min-width: 120px;
            }
            .drop-zone {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Charaktereigenschaften: Vermutungen</h1>
        <p class="subtitle">Welche positiven und negativen Eigenschaften gehören zu welchem Sternzeichen?</p>
    </header>

    <div class="game-container">
        <!-- Левая колонка (Стартовая) -->
        <div class="side-panel" id="left-panel">
            <!-- Слова будут добавлены через JS -->
        </div>

        <!-- Центральная колонка Positiv -->
        <div class="drop-zone-container">
            <div class="drop-zone-title">Positiv</div>
            <div class="drop-zone" id="positive-zone" data-type="positive">
                <!-- Сюда падают правильные -->
            </div>
        </div>

        <!-- Центральная колонка Negativ -->
        <div class="drop-zone-container">
            <div class="drop-zone-title">Negativ</div>
            <div class="drop-zone" id="negative-zone" data-type="negative">
                <!-- Сюда падают неправильные -->
            </div>
        </div>

        <!-- Правая колонка (Стартовая) -->
        <div class="side-panel" id="right-panel">
            <!-- Слова будут добавлены через JS -->
        </div>
    </div>

    <div class="controls">
        <button class="btn-check" onclick="checkAnswers()">Überprüfen</button>
        <button class="btn-reset" onclick="resetGame()">Zurücksetzen</button>
    </div>
    
    <div id="message"></div>

    <script>
        // Список всех слов с указанием их правильной категории
        const wordsData = [
            // Positiv (Хорошие)
            { text: "intelligent", type: "positive" },
            { text: "neugierig", type: "positive" },
            { text: "kontaktfreudig", type: "positive" },
            { text: "kreativ", type: "positive" },
            { text: "hilfsbereit", type: "positive" },
            { text: "großzügig", type: "positive" },
            { text: "feinfühlig", type: "positive" },
            { text: "zielstrebig", type: "positive" },
            { text: "fantasievoll", type: "positive" },
            
            // Negativ (Плохие)
            { text: "ungeduldig", type: "negative" },
            { text: "arrogant", type: "negative" },
            { text: "nachtragend", type: "negative" },
            { text: "oberflächlich", type: "negative" },
            { text: "misstrauisch", type: "negative" },
            { text: "disziplinlos", type: "negative" },
            { text: "egoistisch", type: "negative" },
            { text: "überempfindlich", type: "negative" },
            { text: "unentschlossen", type: "negative" }
        ];

        // Перемешиваем слова для случайного порядка
        const shuffledWords = [...wordsData].sort(() => Math.random() - 0.5);

        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');
        const positiveZone = document.getElementById('positive-zone');
        const negativeZone = document.getElementById('negative-zone');
        const messageEl = document.getElementById('message');

        // Инициализация игры
        function initGame() {
            leftPanel.innerHTML = '';
            rightPanel.innerHTML = '';
            positiveZone.innerHTML = '';
            negativeZone.innerHTML = '';
            messageEl.style.display = 'none';
            
            // Распределяем слова по двум боковым панелям поровну
            const half = Math.ceil(shuffledWords.length / 2);
            
            shuffledWords.forEach((word, index) => {
                const card = createCard(word.text, word.type);
                if (index < half) {
                    leftPanel.appendChild(card);
                } else {
                    rightPanel.appendChild(card);
                }
            });
        }

        // Создание карточки слова
        function createCard(text, type) {
            const div = document.createElement('div');
            div.classList.add('word-card');
            div.draggable = true;
            div.textContent = text;
            div.dataset.type = type; // Сохраняем правильный ответ
            div.dataset.originalText = text;
            
            // События Drag & Drop
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);
            
            // Добавляем клик для удобства (если перетаскивание не работает)
            div.addEventListener('click', () => {
                // Если слово в боковой панели, перемещаем в Positiv (по умолчанию), 
                // но лучше просто позволить перетаскивание. 
                // Для упрощения сделаем так: клик перемещает в первую свободную зону или в Positiv
                // Но чтобы не усложнять, оставим только Drag&Drop, так как это стандарт для таких заданий.
            });

            return div;
        }

        // Drag & Drop логика
        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => this.style.opacity = '0.5', 0);
        }

        function handleDragEnd() {
            this.style.opacity = '1';
            draggedItem = null;
        }

        // Настройка зон сброса
        [positiveZone, negativeZone].forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                
                if (draggedItem) {
                    // Убираем классы валидации при перемещении
                    draggedItem.classList.remove('correct', 'wrong');
                    zone.appendChild(draggedItem);
                }
            });
        });

        // Разрешаем перетаскивание обратно в боковые панели (опционально)
        [leftPanel, rightPanel].forEach(panel => {
            panel.addEventListener('dragover', e => e.preventDefault());
            panel.addEventListener('drop', e => {
                e.preventDefault();
                if (draggedItem) {
                    draggedItem.classList.remove('correct', 'wrong');
                    panel.appendChild(draggedItem);
                }
            });
        });

        // Проверка ответов
        function checkAnswers() {
            const allCards = document.querySelectorAll('.word-card');
            let correctCount = 0;
            let totalInZones = 0;
            let hasErrors = false;

            allCards.forEach(card => {
                // Проверяем только те карточки, которые находятся в центральных зонах
                const parentZone = card.parentElement;
                
                if (parentZone === positiveZone || parentZone === negativeZone) {
                    totalInZones++;
                    const correctType = card.dataset.type;
                    const currentZoneType = parentZone.dataset.type;

                    if (correctType === currentZoneType) {
                        card.classList.add('correct');
                        card.classList.remove('wrong');
                        correctCount++;
                    } else {
                        card.classList.add('wrong');
                        card.classList.remove('correct');
                        hasErrors = true;
                    }
                } else {
                    // Если карточка осталась сбоку, сбрасываем подсветку
                    card.classList.remove('correct', 'wrong');
                }
            });

            // Формируем сообщение
            messageEl.style.display = 'block';
            
            if (totalInZones === 0) {
                messageEl.textContent = "Bitte ziehe zuerst die Wörter in die Kategorien!";
                messageEl.className = "message-error";
                return;
            }

            if (!hasErrors && correctCount === allCards.length) {
                messageEl.textContent = "Super! Alles ist richtig! Du hast alle Eigenschaften korrekt zugeordnet.";
                messageEl.className = "message-success";
            } else {
                const wrongCount = totalInZones - correctCount;
                messageEl.textContent = `Fast! ${correctCount} richtig, aber ${wrongCount} falsch. Die roten Karten sind falsch zugeordnet. Versuche es nochmal!`;
                messageEl.className = "message-error";
            }
        }

        // Сброс игры
        function resetGame() {
            initGame();
            messageEl.style.display = 'none';
        }

        // Запуск
        initGame();

    </script>
</body>
</html>
